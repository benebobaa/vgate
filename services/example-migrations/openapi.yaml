openapi: 3.1.0
info:
  title: example-migrations
  version: '1'
  description: A read-only catalogue of items (README.md).
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [UP] }
  /items:
    get:
      operationId: listItems
      responses:
        '200':
          description: Every item, by id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: integer }
                        name: { type: string }
