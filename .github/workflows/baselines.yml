# One-off: write example-web's Linux screenshot baselines on GitHub's own runner (CI compares on Linux, so the
# baselines must come from Linux). Removed again once the baselines are committed.
name: baselines

on:
  push:
    branches: [phase-e-f]

permissions:
  contents: read

jobs:
  linux-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm vgate doctor --service example-web --fix
      - run: pnpm vgate up --service example-web
      - name: Write the baselines
        env:
          VGATE_UPDATE_SNAPSHOTS: '1'
        run: pnpm vgate gate --service example-web --steps test || true
      - name: Check them twice (deterministic)
        run: |
          pnpm vgate gate --service example-web --steps test
          pnpm vgate gate --service example-web --steps test
      - if: always()
        run: pnpm vgate down --service example-web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-baselines
          path: services/example-web/tests/__screenshots__/linux/
          retention-days: 3
