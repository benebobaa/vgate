# vgate as GitLab CI/CD components (publish this directory's files in your components project; docs/ci.md):
#
#   regression-gate  (this file) include once per service. Two jobs:
#     vgate:gate:<service>   merge requests and the default branch: the service's stack and the whole gate
#     vgate:guard:<service>  merge requests: compares the expectations with the merge request's base
#   pr-decision      (pr-decision.yml) include once. vgate:decide reads every service's evidence and decides
#                    merge | needs-approval | blocked, with one upserted merge-request note (docs/pr-verification.md)
#
# On a merge request each job first asks `vgate affected` whether its service is touched; if not it exits at once
# and leaves no evidence, which is right: vgate decide expects evidence only from the services it finds affected, and
# blocks on any it expected but did not get. So a service missing from your includes fails closed, it is never skipped.
#
# The judge is the pinned image: its vgate carries the framework and runs it against the checkout (--root), so a merge
# request can change the tests under judgement, not the judge. Evidence is vgate's own JSON output, never a file from
# the checkout: every job deletes the reports directory first, keeps its scratch files outside the checkout (untracked
# files there would count as part of the change), and passes on only what vgate printed.
spec:
  inputs:
    service:
      description: The service under judgement (its directory name under the project's servicesDir).
    environment:
      description: The service.yaml environment to run against.
      default: local
    image:
      description: The pinned vgate image, by version or digest (never a moving tag such as latest).
    reports_dir:
      description: >-
        vgate.yaml's reportsDir, relative to the checkout: deleted before each job and uploaded as the full reports.
        Evidence never comes from it, so a wrong value loses reports, never lets a merge request through.
      default: reports
    stage:
      description: The stage both jobs run in.
      default: test
    services:
      description: >-
        CI services the gate's stack needs. The default is a Docker-in-Docker daemon for compose stacks; a service
        whose stack needs no Docker passes [].
      type: array
      default:
        - name: docker:29.0.0-dind
          alias: docker
    stack_host:
      description: >-
        Where the stack's published ports answer, exported as STACK_HOST for service.yaml (`${STACK_HOST:-localhost}`).
        `docker` with the default DinD service; `localhost` on a Kubernetes executor or without Docker.
      default: docker
---
.vgate:$[[ inputs.service ]]:
  image:
    name: $[[ inputs.image ]]
    entrypoint: ['']
  stage: $[[ inputs.stage ]]
  variables:
    SERVICE: $[[ inputs.service ]]
    TEST_ENV: $[[ inputs.environment ]]
    VGATE_REPORTS_DIR: $[[ inputs.reports_dir ]]
    # affected and guard read the base's files from git: the history down to the merge base.
    GIT_DEPTH: '0'
  interruptible: true
  before_script:
    - |
      # Scratch files live outside the checkout: an untracked file there would count as part of the change.
      VGATE_TMP=$(mktemp -d)
      export VGATE_TMP
      # On a merge request, a service the change does not touch has nothing to prove.
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        vgate affected --root "$CI_PROJECT_DIR" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --json > "$VGATE_TMP/affected.json" \
          || { echo "vgate affected failed" >&2; cat "$VGATE_TMP/affected.json"; exit 2; }
        VGATE_AFFECTED=$(jq -r --arg s "$SERVICE" '[.data.services[].name] | index($s) != null' "$VGATE_TMP/affected.json")
        VGATE_DELETED=$(jq -r --arg s "$SERVICE" '(.data.deleted // []) | index($s) != null' "$VGATE_TMP/affected.json")
        export VGATE_AFFECTED VGATE_DELETED
      else
        export VGATE_AFFECTED=true VGATE_DELETED=false
      fi

vgate:guard:$[[ inputs.service ]]:
  extends: .vgate:$[[ inputs.service ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - |
      if [ "$VGATE_AFFECTED" != true ] && [ "$VGATE_DELETED" != true ]; then
        echo "$SERVICE is not affected by this change: nothing to guard."; exit 0
      fi
      # A merge request can commit a reports/guard.json or a vgate-evidence/: only the guard's own answer counts.
      rm -rf "$VGATE_REPORTS_DIR" vgate-evidence
      set +e
      vgate guard --root "$CI_PROJECT_DIR" --service "$SERVICE" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --json \
        > "$VGATE_TMP/guard.json"
      status=$?
      set -e
      jq -r '.summary' "$VGATE_TMP/guard.json" || cat "$VGATE_TMP/guard.json"
      # 0 auto, 1 needs-human: both are answers, and vgate:decide weighs them (and asks the human). Else no answer.
      case $status in
        0 | 1) ;;
        *) echo "The guard could not judge this change (exit $status)." >&2; exit "$status" ;;
      esac
      mkdir -p "vgate-evidence/$SERVICE"
      jq -e --arg s "$SERVICE" '.data | select(.schema == "vgate.guard/1" and .service == $s)' "$VGATE_TMP/guard.json" \
        > "vgate-evidence/$SERVICE/guard.json" \
        || { rm -f "vgate-evidence/$SERVICE/guard.json"; echo "No usable guard report: vgate:decide counts the guard as not run."; }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - vgate-evidence/

vgate:gate:$[[ inputs.service ]]:
  extends: .vgate:$[[ inputs.service ]]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  services: $[[ inputs.services ]]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: '1'
    STACK_HOST: $[[ inputs.stack_host ]]
  # Every command runs in the script: on the Docker executor after_script starts a fresh container that would not see
  # the stack. The stack dies with the job and its DinD service anyway; `down` is for tidiness.
  script:
    - |
      if [ "$VGATE_AFFECTED" != true ]; then echo "$SERVICE is not affected by this change: nothing to gate."; exit 0; fi
      services_dir=$(vgate services --root "$CI_PROJECT_DIR" --json | jq -r '.data.servicesDir // empty')
      [ -n "$services_dir" ] && [ -f "$CI_PROJECT_DIR/$services_dir/$SERVICE/service.yaml" ] \
        || { echo "No service.yaml for $SERVICE under the project's servicesDir (${services_dir:-unknown})" >&2; exit 2; }
      # A merge request can commit a reports/verdict.json or a vgate-evidence/: only this run's verdict counts.
      rm -rf "$VGATE_REPORTS_DIR" vgate-evidence
      set +e
      vgate doctor --root "$CI_PROJECT_DIR" --service "$SERVICE" --env "$TEST_ENV" --fix
      status=$?
      started=false
      if [ $status -eq 0 ]; then
        started=true
        vgate up --root "$CI_PROJECT_DIR" --service "$SERVICE" --env "$TEST_ENV"
        status=$?
      fi
      if [ $status -eq 0 ]; then
        vgate gate --root "$CI_PROJECT_DIR" --service "$SERVICE" --env "$TEST_ENV" --json > "$VGATE_TMP/gate.json"
        status=$?
        jq -r '.summary' "$VGATE_TMP/gate.json" || cat "$VGATE_TMP/gate.json"
        jq -r '(.data.tests.failures // [])[:30][] | "FAIL [\(.id // "-")] \(.file):\(.line // "-")  \(.message)"' \
          "$VGATE_TMP/gate.json" 2>/dev/null
      fi
      [ "$started" = true ] && vgate down --root "$CI_PROJECT_DIR" --service "$SERVICE" --env "$TEST_ENV" >/dev/null 2>&1
      # Only the verdict vgate printed travels to vgate:decide; a missing verdict is a missing proof, and decide blocks.
      mkdir -p "vgate-evidence/$SERVICE"
      jq -e --arg s "$SERVICE" '.data | select(.schema == "vgate.verdict/1" and .service == $s)' "$VGATE_TMP/gate.json" \
        > "vgate-evidence/$SERVICE/verdict.json" 2>/dev/null \
        || { rm -f "vgate-evidence/$SERVICE/verdict.json"; echo "No verdict for $SERVICE: the gate did not finish."; }
      # Database migrations, on merge requests only (they have a base): lint, apply, round trip, the deployed code on
      # the new schema. A service without `migrate:` answers "not configured" at once.
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        vgate migrations --root "$CI_PROJECT_DIR" --service "$SERVICE" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
          --json > "$VGATE_TMP/migrations.json"
        jq -r '.summary' "$VGATE_TMP/migrations.json" 2>/dev/null || true
        jq -e --arg s "$SERVICE" '.data | select(.schema == "vgate.migrations/1" and .service == $s)' \
          "$VGATE_TMP/migrations.json" > "vgate-evidence/$SERVICE/migrations.json" 2>/dev/null \
          || rm -f "vgate-evidence/$SERVICE/migrations.json"
      fi
      # Mutation score, when vgate.yaml sets policy.mutationScore (a rebuild per mutant): do the tests catch bugs in the
      # lines this change wrote? decide reads the evidence; a low score asks for a human, never blocks.
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ] && grep -Eq '^[^#]*mutationScore['\''"]?[[:space:]]*:' "$CI_PROJECT_DIR/vgate.yaml"; then
        vgate mutate --root "$CI_PROJECT_DIR" --service "$SERVICE" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
          --json > "$VGATE_TMP/mutation.json"
        jq -r '.summary' "$VGATE_TMP/mutation.json" 2>/dev/null || true
        jq -e --arg s "$SERVICE" '.data | select(.schema == "vgate.mutation/1" and .service == $s)' \
          "$VGATE_TMP/mutation.json" > "vgate-evidence/$SERVICE/mutation.json" 2>/dev/null \
          || rm -f "vgate-evidence/$SERVICE/mutation.json"
      fi
      exit $status
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - $[[ inputs.reports_dir ]]/
      - vgate-evidence/
    reports:
      junit:
        - $[[ inputs.reports_dir ]]/junit/*.xml
        - $[[ inputs.reports_dir ]]/schemathesis/*/junit.xml
